name: collect
# Every hour, 6am-10pm UK: sample live positions for 50 minutes, score them against the timetable, save the
# per-route counts and rebuild RESULTS.md. Public repos get unlimited Actions minutes.
# GitHub's scheduler only fires a few of these a day, so each run also starts the next one until 9pm UK;
# the schedule is the backup that restarts the chain each morning.
on:
  schedule:
    - cron: "3 6-21 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "minutes to collect"
        default: "50"
permissions:
  contents: write
  actions: write   # to start the next run
concurrency: {group: collect, cancel-in-progress: false}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - id: week
        run: echo "w=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Timetable (cached for a week; it changes rarely and is 285 MB)
        id: cache
        uses: actions/cache@v4
        with:
          path: data/gtfs
          key: gtfs-yorkshire-${{ steps.week.outputs.w }}
      - run: test -f data/gtfs/stop_times.txt || python -m pipeline.fetch timetable
      - run: python -m pipeline.collect ${{ inputs.minutes || 50 }}
      - run: dbt run && dbt test
        env: {DBT_PROFILES_DIR: .}
      - run: python -m pipeline.report
      - name: Commit this hour's counts and the leaderboard
        run: |
          git config user.name "bus-bot" && git config user.email "bot@users.noreply.github.com"
          git add data/runs RESULTS.md data/stats.json
          git diff --cached --quiet && exit 0
          git commit -qm "sample $(date -u +%Y-%m-%d_%H:%M)"
          git pull --rebase -q
          git push
      - name: Start the next sample
        # not after a manual cancel, so cancelling a run stops the chain
        if: success() || failure()
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          if [ "$(TZ=Europe/London date +%-H)" -lt 21 ]; then gh workflow run collect.yml --ref main -R "$GITHUB_REPOSITORY"
          else echo "last sample of the day"; fi
